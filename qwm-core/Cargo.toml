[package]
name = "qwm-core"
version.workspace = true
edition.workspace = true

[dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code", "randr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "6"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
